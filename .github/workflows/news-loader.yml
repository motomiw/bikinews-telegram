name: RSS → обновить загрузчик

on:
  push:
    branches: [main]
    paths: ['host-tools/**', '.github/workflows/news-loader.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: host-news-loader
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, mbstring, curl, json
          coverage: none
      - name: Проверка PHP и сценариев отказа
        run: |
          php -l host-tools/news.php
          python host-tools/test_news.py
      - name: Резервная копия, замена и проверка рабочего загрузчика
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PROTOCOL: ${{ secrets.FTP_PROTOCOL || 'ftp' }}
        run: python host-tools/deploy_news.py
