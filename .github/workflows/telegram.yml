name: Быки News → Telegram

on:
  schedule:
    - cron: '0 0,3,6,8,10,12,14,16,18,20,21 * * *' # 00,03,06,09,11,13,15,17,19,21,23 МСК
    - cron: '7,17,27,37,47,57 * * * *' # резервная проверка каждые 10 минут
  push:
    branches: [main]
    paths: ['.github/workflows/telegram.yml', 'poster.py', 'test_poster.py']
  workflow_run:
    workflows: ['Сайт → хостинг']
    types: [completed]
    branches: [main]
  workflow_dispatch:            # кнопка «Run workflow» для ручного запуска
    inputs:
      test:
        description: 'Отправить тестовое сообщение в канал'
        type: boolean
        default: false

permissions:
  contents: write               # чтобы сохранять state.json (что уже опубликовано)

concurrency:
  group: telegram-poster
  cancel-in-progress: false

jobs:
  post:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Проверка логики без сетевых отправок
        run: python -m unittest test_poster -v
      - name: Публикация новостей
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          TG_TEST: ${{ github.event.inputs.test }}
          RUSTORE_PUSH_TOKEN: ${{ secrets.RUSTORE_PUSH_TOKEN }}
          RUSTORE_PROJECT_ID: yjFEIHAngjHe3cf8bohYyeSRzDcc7gqf
        run: python poster.py
      - name: Сохранить, что уже опубликовано
        if: ${{ always() && !cancelled() }}
        run: |
          git config user.name "bikinews-bot"
          git config user.email "bikinews-bot@users.noreply.github.com"
          git add state.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Обновлён state.json"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && exit 0
            sleep 5
          done
          exit 1
