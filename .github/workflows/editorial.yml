name: Редакция → Главное

on:
  schedule:
    # За полчаса до дайджестов, UTC (МСК = UTC+3).
    - cron: '30 2,5,7,9,11,13,15,17,19,20,23 * * *'
  push:
    branches: [main]
    paths: ['news_writer.py', 'test_news_writer.py', '.github/workflows/editorial.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: editorial-main
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Публикуются только материалы, прошедшие все проверки.
      NEWS_AUTOPUBLISH: 'true'
      NORDROUTER_API_KEY: ${{ secrets.nordroutercom }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Проверка отбора, дублей и прямого API
        run: python -m unittest test_news_writer -v
      - name: Проверка подключения NordRouter
        id: backend
        run: |
          if [ -z "$NORDROUTER_API_KEY" ]; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Добавьте ключ NordRouter в секрет nordroutercom. Анализ и публикация пока не включены.'
            echo '### Нужен ключ NordRouter' >> "$GITHUB_STEP_SUMMARY"
            echo 'Добавьте nordroutercom в секреты репозитория. Используется API NordRouter (DeepSeek V4.1 Flash). Нужен доступный баланс API.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Проверка ключа и доступности NordRouter
        if: steps.backend.outputs.ready == 'true'
        run: python news_writer.py --check-api
      - name: Извлечение текстов и сборка
        if: steps.backend.outputs.ready == 'true'
        run: pip install trafilatura==2.0.0 pillow
      - name: Анализ источников и собственный пересказ
        if: steps.backend.outputs.ready == 'true'
        run: |
          if [ "$NEWS_AUTOPUBLISH" = 'true' ]; then
            python news_writer.py --publish
          else
            python news_writer.py
          fi
      - name: Отчёт о пробном пересказе
        if: always() && steps.backend.outputs.ready == 'true'
        run: |
          if [ -f news-draft.json ]; then
            echo '### Результат редакции' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat news-draft.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Проверка сборки
        if: steps.backend.outputs.ready == 'true'
        run: python site-src/build.py
      - uses: actions/upload-artifact@v4
        if: always() && steps.backend.outputs.ready == 'true'
        with:
          name: editorial-report
          path: news-draft.json
          retention-days: 7
      - name: Сохранить подготовленную новость
        if: env.NEWS_AUTOPUBLISH == 'true' && steps.backend.outputs.ready == 'true'
        run: |
          git config user.name 'bikinews-editor'
          git config user.email 'bikinews-editor@users.noreply.github.com'
          git add site-src/bykinews.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Редакция: новый проверенный пересказ в Главное'
          git pull --rebase origin main
          git push origin HEAD:main
