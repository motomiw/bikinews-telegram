name: Android-приложение — проверка на эмуляторе

# Ставит отладочную сборку на эмулятор Android 14, проходит по вкладкам и сохраняет скриншоты
# в ветку android-screens (оттуда их удобно брать для карточки RuStore).
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-check.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Отладочная сборка и lint
        working-directory: android
        run: gradle --no-daemon assembleDebug lintDebug

      - name: Включить KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Прогон на эмуляторе
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            python3 android/tools/screens.py screens

      - name: Сохранить скриншоты в ветку android-screens
        if: always()
        run: |
          mkdir -p screens
          cp android/app/build/reports/lint-results-debug.txt screens/lint.txt 2>/dev/null || true
          cp android/app/build/reports/lint-results-debug.html screens/lint.html 2>/dev/null || true
          cd screens
          git init -q -b android-screens
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "Скриншоты приложения, запуск ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" android-screens
