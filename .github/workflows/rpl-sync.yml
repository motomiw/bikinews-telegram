name: РПЛ → таблица и матчи

on:
  schedule:
    - cron: '3-59/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rpl-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.save.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Проверка механизма обновления
        run: python -m unittest discover -s site-src -p 'test_rpl_sync.py' -v
      - name: Получить подтверждённые результаты и таблицу
        run: |
          python site-src/matchday.py
          python site-src/build.py
      - name: Сохранить изменения для сайта
        id: save
        run: |
          git config user.name "bikinews-bot"
          git config user.email "bikinews-bot@users.noreply.github.com"
          git add site-src/matchday.json
          if git diff --cached --quiet; then
            echo "Новых подтверждённых данных нет."
            exit 0
          fi
          git commit -m "Обновлены таблица РПЛ и результаты"
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 5
          done
          exit 1
  publish:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
