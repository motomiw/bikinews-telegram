name: РПЛ → таблица и матчи

on:
  schedule:
    # 13:10–00:50 по Москве: проверка результатов после матчей.
    - cron: '10,30,50 10-21 * * *'
    # Утреннее обновление на случай переноса или позднего протокола.
    - cron: '10 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rpl-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Проверка механизма обновления
        run: python -m unittest discover -s site-src -p 'test_rpl_sync.py' -v
      - name: Получить подтверждённые результаты и таблицу
        run: python site-src/rpl_sync.py
      - name: Сохранить изменения для сайта
        run: |
          git config user.name "bikinews-bot"
          git config user.email "bikinews-bot@users.noreply.github.com"
          git add site-src/bykinews.html site-src/rpl-sync.json
          if git diff --cached --quiet; then
            echo "Новых подтверждённых данных нет."
            exit 0
          fi
          git commit -m "Обновлены таблица РПЛ и результаты"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && exit 0
            sleep 5
          done
          exit 1
