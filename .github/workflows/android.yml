name: Android-приложение

# Собирает приложение «Быки News» для Android (APK для RuStore и AAB).
# Запускается само при изменениях в папке android/, или вручную кнопкой «Run workflow».
# Готовые файлы — внизу страницы запуска, в разделе Artifacts.
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Ключ подписи
        id: key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "Секрет ANDROID_KEYSTORE_B64 не добавлен — соберу неподписанную проверочную версию (для RuStore не годится)."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Сборка
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: bikinews
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          gradle --no-daemon assembleRelease bundleRelease lint

      - name: Проверка подписи
        if: steps.key.outputs.signed == 'true'
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs android/app/build/outputs/apk/release/app-release.apk
          "$BT/aapt2" dump badging android/app/build/outputs/apk/release/app-release.apk | head -5

      - name: Файлы для загрузки
        run: |
          mkdir out
          V="1.0.${{ github.run_number }}"
          for f in android/app/build/outputs/apk/release/*.apk; do cp "$f" "out/bikinews-$V$( [ '${{ steps.key.outputs.signed }}' = 'true' ] || echo '-UNSIGNED').apk"; done
          cp android/app/build/outputs/bundle/release/*.aab "out/bikinews-$V.aab"
          cp android/app/build/reports/lint-results-release.html out/lint.html 2>/dev/null || true
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: bikinews-android-1.0.${{ github.run_number }}
          path: out/
          retention-days: 90
