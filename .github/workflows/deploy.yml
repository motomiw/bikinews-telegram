name: Сайт → хостинг

# Собирает сайт из папки site-src и выкладывает на SpaceWeb по FTP.
# Запускается сам при любом изменении в site-src, или вручную кнопкой «Run workflow».
on:
  push:
    branches: [main]
    paths:
      - 'site-src/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Сборка сайта
        run: python site-src/build.py
      - name: Проверка настроек FTP
        id: chk
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        run: |
          if [ -z "$FTP_SERVER" ]; then
            echo "Секреты FTP ещё не добавлены — сайт собран, но не выложен."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Выкладка на хостинг по FTP
        if: steps.chk.outputs.ok == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_DIR }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftp' }}
          local-dir: ./dist/
          # Скрипт трогает только файлы, которые сам выкладывал.
          # news.php, data/news.json, data/archive.json, data/tg-config.php и журнал не затрагиваются.
