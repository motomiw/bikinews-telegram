plugins {
    id 'com.android.application'
}

// Номер сборки растёт сам (номер запуска GitHub Actions) — RuStore принимает обновление только с бо́льшим versionCode.
def runNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()
def ksFile = System.getenv('KEYSTORE_FILE')

android {
    namespace 'ru.bikinews.app'
    compileSdk 35

    defaultConfig {
        applicationId 'ru.bikinews.app'
        minSdk 24
        targetSdk 35
        versionCode runNumber
        versionName "1.0.${runNumber}"
    }

    signingConfigs {
        release {
            if (ksFile) {
                storeFile file(ksFile)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (ksFile) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    dependenciesInfo {
        // RuStore и Google Play не требуют этот блок; не встраиваем лишние метаданные
        includeInApk = false
        includeInBundle = false
    }
}

dependencies {
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}
